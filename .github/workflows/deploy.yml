# Deploys keepbreath.ing to the droplet after CI passes on main.
#
# The SSH key this uses is not a general key to the box. On the droplet it is
# registered with `restrict` and a forced command, so it can run
# /usr/local/bin/deploy-site and nothing else — no shell, no PTY, no port
# forwarding. Verified by attempting `cat /etc/shadow` with it and getting the
# deploy script instead.
#
# The secrets live in the `production` environment, whose branch policy allows
# only `main`. A pull request cannot reach them.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual escape hatch, for when the droplet was unreachable during the
  # automatic run. It deploys whatever is currently on main. That is safe
  # because main is protected and cannot hold a commit that failed CI, but it
  # does skip the conclusion check below, so it is a deliberate bypass.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-24.04
    # Only deploy when CI actually passed. workflow_run fires on failure too.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
      url: https://keepbreath.ing
    steps:
      - name: Load the deploy key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY" > ~/.ssh/deploy_key
          # OpenSSH refuses to parse a private key whose file does not end in a
          # newline, and GitHub strips trailing whitespace from secret values.
          # The failure is "error in libcrypto" and then Permission denied, which
          # reads like a rejected key rather than a malformed file.
          if [ -n "$(tail -c1 ~/.ssh/deploy_key)" ]; then
            printf '\n' >> ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The remote command is ignored: sshd runs the forced command regardless.
      # It is written out anyway so the intent is readable in the logs.
      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # keepbreath1, not root. That account owns /srv/keepbreathing and the
          # container, so it can do the whole deploy, and the key is registered
          # there with restrict and a forced command.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              "keepbreath1@${HOST}" deploy-site

      # The runner is ephemeral, so the key dies with the VM regardless. Removing
      # it explicitly means a later step added to this job can never pick it up.
      - name: Remove the deploy key
        if: always()
        run: shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
