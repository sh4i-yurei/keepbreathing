# Deploys keepbreath.ing to the web box after CI passes on main.
#
# Runs on the self-hosted runner on the control plane (deploy/runner/), which
# reaches the web box over the private network. Nothing inbound is needed
# anywhere: the runner only makes outbound connections to GitHub, and the web
# box only has to accept SSH from the control plane's private address.
#
# The SSH key is the runner account's own, mounted read-only into the runner
# container. On the web box it is registered with `restrict`, a forced command
# and a `from=` clause, so it can run /usr/local/bin/deploy-site and nothing
# else, and only from the control plane — no shell, no PTY, no port forwarding.
# Verified by attempting `cat /etc/shadow` with it and getting the deploy
# script instead.
#
# The `production` environment's branch policy allows only `main`, so a pull
# request cannot trigger this job on the runner.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual escape hatch, for when the droplet was unreachable during the
  # automatic run. It deploys whatever is currently on main. That is safe
  # because main is protected and cannot hold a commit that failed CI, but it
  # does skip the conclusion check below, so it is a deliberate bypass.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to web box
    runs-on: [self-hosted, keepbreathing]
    # Only deploy when CI actually passed. workflow_run fires on failure too.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
      url: https://keepbreath.ing
    steps:
      # The remote command is ignored: sshd runs the forced command regardless.
      # It is written out anyway so the intent is readable in the logs.
      - name: Deploy
        run: |
          # keepbreath1, not root. That account owns /srv/keepbreathing and the
          # container, so it can do the whole deploy, and the key is registered
          # there with restrict and a forced command. The host is the web box's
          # private address; the runner's known_hosts already carries it.
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
              keepbreath1@10.128.0.3 deploy-site
