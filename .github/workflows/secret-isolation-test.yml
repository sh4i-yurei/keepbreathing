name: Secret isolation test
on: [push]
permissions:
  contents: read
jobs:
  try-to-read-production-secret:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Report whether the deploy key was reachable
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "SECRET WAS READABLE FROM THIS BRANCH"; exit 1
          else echo "secret not available on this branch (expected)"; fi
