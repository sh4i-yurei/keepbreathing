services:
  web:
    image: nginx:alpine
    container_name: keepbreath
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"       # defaults to prod 80; override for staging
      - "${HTTPS_PORT:-443}:443"    # defaults to prod 443; override for staging
    volumes:
      - ../site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
