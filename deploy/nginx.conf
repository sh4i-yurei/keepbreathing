# keepbreath.ing
# nginx configuration — serves the hand-coded static site over HTTPS,
# with plain HTTP redirected up to HTTPS.
# Author:   Mark Thompson
# Date:     2026-08-04
# Filename: nginx.conf

events {}

http {
    # Map file extensions to their Content-Type so responses are typed right.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ====================================================================
    # COMPRESSION
    # ====================================================================
    # gzip text responses on the fly; the browser decompresses them. Text
    # shrinks roughly 70-80 percent. Already-compressed types (images, video)
    # are left alone.
    gzip on;
    gzip_comp_level 5;                 # 1-9; level 5 balances size against CPU
    gzip_min_length 256;               # skip tiny files, not worth the overhead
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;                 # text/html is always gzipped when gzip is on

    # ====================================================================
    # HTTP -> HTTPS REDIRECT
    # ====================================================================
    # Anything arriving on port 80 is bounced to the HTTPS version of the URL.
    server {
        listen 80;
        server_name keepbreath.ing www.keepbreath.ing;
        return 301 https://$host$request_uri;
    }

    # ====================================================================
    # HTTPS SITE
    # ====================================================================
    # Serves the site over TLS using the Cloudflare Origin Certificate (mounted
    # at /etc/nginx/certs). Cloudflare is the only client that connects here, so
    # this cert is validated end to end under SSL/TLS mode Full (strict).
    server {
        listen 443 ssl;
        http2 on;
        server_name keepbreath.ing www.keepbreath.ing;

        ssl_certificate     /etc/nginx/certs/origin.pem;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        root  /usr/share/nginx/html;   # the site files are mounted here
        index index.html;

        # ====================================================================
        # SECURITY HEADERS
        # ====================================================================
        # Sent on every response (always). HSTS starts with a short max-age
        # during rollout (limits lock-in if we must revert); raise it to
        # 31536000 (one year) once HTTPS is proven stable.
        add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self' https://api.github.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # Serve the requested file, then the folder index, otherwise a 404.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
