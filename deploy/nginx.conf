# nginx.conf — keepbreath.ing
# First version: serve the static site over plain HTTP. gzip, security
# headers, and HTTPS come in later steps.

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # --- compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;


    server {
        listen 80;
        server_name keepbreath.ing www.keepbreath.ing;

        root  /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
