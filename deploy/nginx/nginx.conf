# ============================================================
# keepbreath.ing — site nginx config (nginx.conf)
# Author: Mark Thompson
# ============================================================
# Serves the hand-coded static site over HTTPS (plain HTTP redirected up), with
# security headers, gzip, and a rate-limited /api/ proxy to the contact-api
# container. TLS via the Cloudflare Origin Certificate (SSL mode Full (strict)).

# Deploys are automated: .github/workflows/deploy.yml runs /usr/local/bin/deploy-site
# on the droplet, which restarts this container only when THIS file changes.
events {}

http {
    # Map file extensions to their Content-Type so responses are typed right.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ====================================================================
    # COMPRESSION
    # ====================================================================
    # gzip text responses on the fly; the browser decompresses them. Text
    # shrinks roughly 70-80 percent. Already-compressed types (images, video)
    # are left alone.
    gzip on;
    gzip_comp_level 5;                 # 1-9; level 5 balances size against CPU
    gzip_min_length 256;               # skip tiny files, not worth the overhead
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;                 # text/html is always gzipped when gzip is on

    # ====================================================================
    # RATE LIMITING
    # ====================================================================
    # Per-visitor limit for the contact API. Key on Cloudflare's real-client
    # header, because CF fronts every request (the DO firewall admits only CF
    # ranges), so $binary_remote_addr here would just be a Cloudflare edge IP.
    # If that header is ever missing (a health check, or anything reaching nginx
    # without going through Cloudflare), fall back to the direct connection
    # address, so those requests are still limited per client instead of all
    # sharing one bucket under an empty key.
    # 5 requests/minute is plenty for a human filling out a form.
    map $http_cf_connecting_ip $contact_client {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }
    limit_req_zone $contact_client zone=contact:10m rate=5r/m;
    limit_req_status 429;              # reject over-limit with 429, not the default 503

    # ====================================================================
    # HTTP -> HTTPS REDIRECT
    # ====================================================================
    # Anything arriving on port 80 is bounced to the HTTPS version of the URL.
    server {
        listen 80;
        server_name keepbreath.ing www.keepbreath.ing;
        return 301 https://$host$request_uri;
    }

    # ====================================================================
    # HTTPS SITE
    # ====================================================================
    # Serves the site over TLS using the Cloudflare Origin Certificate (mounted
    # at /etc/nginx/certs). Cloudflare is the only client that connects here, so
    # this cert is validated end to end under SSL/TLS mode Full (strict).
    server {
        listen 443 ssl;
        http2 on;
        server_name keepbreath.ing www.keepbreath.ing;

        ssl_certificate     /etc/nginx/certs/origin.pem;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        root  /usr/share/nginx/html;   # the site files are mounted here
        index index.html;

        # ====================================================================
        # SECURITY HEADERS
        # ====================================================================
        # Sent on every response (always). HSTS forces browsers to use HTTPS
        # for a year; raised to this value after confirming HTTPS is stable.
        # (preload deliberately left off - it is a hard-to-undo commitment.)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        # style-src deliberately omits 'unsafe-inline'. The self-hosted ALTCHA widget
        # injects an inline <style> at load, which this blocks, so the browser logs a
        # warning for it. Accepted for now: the widget is invisible and works through
        # its script and worker, so the blocked style has no effect. A stricter,
        # nonce-based policy is planned for when the site gains a build step.
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self' https://api.github.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # ====================================================================
        # CONTACT API  (reverse proxy to the contact-api container)
        # ====================================================================
        # Rate-limited proxy for /api/contact and /api/challenge. The upstream is
        # the contact-api container on the shared keepbreath-net network; it
        # publishes no host ports, so this is the only way in.
        location /api/ {
            limit_req zone=contact burst=3 nodelay;
            client_max_body_size 16k;              # match the app's 16 KB body cap

            # Resolve the container name at request time rather than at startup, so
            # nginx still boots if contact-api is down (502 until it's up) rather than
            # failing to start on an unresolved upstream.
            #
            # 10.89.0.1 is the gateway of the keepbreath-net podman network, where
            # aardvark-dns answers container-name lookups. It is recorded in
            # ~/.local/share/containers/storage/networks/keepbreath-net.json and
            # survives reboots. Deleting and recreating that network would allocate a
            # different range and break this line — the symptom is a 502 on /api/ while
            # the site and every container still look healthy.
            #
            # Was 127.0.0.11, Docker's embedded DNS, which does not exist under podman.
            resolver 10.89.0.1 valid=30s;
            set $contact_api http://contact-api:8000;
            proxy_pass $contact_api$request_uri;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve the requested file, then the folder index, otherwise a 404.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
