<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep Breathing — sendmail</title>
    <link href="styles.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;700&display=swap"
    rel="stylesheet" />
    <script src="js/altcha.js" type="module"></script>
    <script src="support.js" defer></script>
</head>

<body>

    <!-- ==================================================================== -->
    <!-- BACKGROUND CANVAS LAYERS -->
    <!-- ==================================================================== -->
    <canvas id="phantom" class="phantom"></canvas>
    <div class="scanline" data-scan></div>
    <div class="crt-overlay"></div>
    <!-- Fixed full-viewport layers behind all content; support.js animates the phantom code and scan line. -->


    <!-- ==================================================================== -->
    <!-- SIDEBAR -->
    <!-- ==================================================================== -->
    <aside>

        <!-- ------------------------------ Brand ------------------------------- -->
        <div class="brand">
            <div class="brand-top">
                <a href="index.html">keepbreath<span class="dot">.</span>ing</a>
                <span class="status-dot"></span>
            </div>
            <div class="subtitle">traceroute.dev</div>
        </div>
        <!-- Site wordmark linking home, with the live status dot and host tagline. -->

        <!-- ---------------------------- Navigation ---------------------------- -->
        <div class="nav-label"># navigation</div>
        <nav>
            <ul>
                <li><a href="index.html">init</a></li>
                <li><a href="about.html">whois</a></li>
                <li><a href="projects.html">make</a></li>
                <li><a href="blog.html">stdout</a></li>
                <li><a href="resume.html">cat resume.txt</a></li>
                <li><a href="contact.html" class="active">sendmail</a></li>
                <li><a href="journey.html">uptime</a></li>
            </ul>
        </nav>
        <!-- Same nav on every page; the current page carries class="active" (here, sendmail). -->

        <!-- --------------------------- Kana Overlay --------------------------- -->
        <div class="kana-overlay">
            <span class="kana">起</span>
            <span class="kana">誰</span>
            <span class="kana">作</span>
            <span class="kana">文</span>
            <span class="kana">歴</span>
            <span class="kana">連</span>
            <span class="kana">跡</span>
        </div>
        <!-- Decorative Japanese characters positioned by .kana-overlay; purely visual. -->

        <!-- --------------------------- Social Links --------------------------- -->
        <div class="sidebar-bottom">
            <div class="sidebar-status">
                <span class="status-label">status</span>
                <span class="status-value"><span class="status-dot-sm"></span> ONLINE</span>
            </div>
            <div class="sidebar-status">
                <span class="status-label">node</span>
                <span class="status-value">us-east</span>
            </div>
            <div class="social-links">
                <a href="https://github.com/sh4i-yurei" target="_blank">github</a>
                <a href="https://www.linkedin.com/in/mark-thompson-76587735/" target="_blank">linkedin</a>
            </div>
        </div>
        <!-- Status readouts plus outbound GitHub and LinkedIn links; identical block on every page. -->

    </aside>


    <!-- ==================================================================== -->
    <!-- MAIN COLUMN -->
    <!-- ==================================================================== -->
    <main>

        <!-- ----------------------------- Top Bar ------------------------------ -->
        <header>
            <div class="traffic-lights">
                <span class="tl-red"></span>
                <span class="tl-amber"></span>
                <span class="tl-green"></span>
            </div>
            <div class="prompt">mark@traceroute.dev:~/<span class="path">sendmail</span>$</div>
            <div class="clock" id="clock"></div>
        </header>
        <!-- Terminal-style title bar: traffic-light dots, the shell prompt showing the page path, and a live clock (#clock). -->

        <!-- -------------------------- Contact Layout -------------------------- -->
        <!-- Two columns: heading and form on the left, graphic centered in the open space on the right. -->
        <div class="contact-layout">

            <div class="contact-left">

                <!-- --------------------------- Page Heading --------------------------- -->
                <div class="page-hero">
                    <h1 class="page-title">Get in <span class="accent">Touch</span><span class="caret">▋</span></h1>
                </div>
                <p class="projects-subtitle">Drop me a line and I'll get back to you.</p>
                <!-- Two-tone page title with a blinking caret, followed by the page subtitle. -->

                <!-- --------------------------- Confirmation --------------------------- -->
                <div id="cf-result" role="status" aria-live="polite"></div>
                <!-- support.js writes the success or error message here, above the form so it is seen. -->

                <!-- --------------------------- Contact Form --------------------------- -->
                <form id="contact-form" class="contact-form" novalidate>
                    <!-- Honeypot: hidden from people and assistive tech; bots fill it and get silently dropped. -->
                    <div class="hp-field" aria-hidden="true">
                        <label for="cf-website">Leave this field blank</label>
                        <input id="cf-website" name="website" type="text" tabindex="-1" autocomplete="off">
                    </div>

                    <label for="cf-name">name</label>
                    <input id="cf-name" type="text" placeholder="your name">

                    <label for="cf-email">email</label>
                    <input id="cf-email" type="text" placeholder="you@example.com">

                    <label for="cf-message">message</label>
                    <textarea id="cf-message" rows="6" placeholder="what's on your mind?"></textarea>

                    <!-- Invisible ALTCHA proof-of-work: solves on submit; the hidden input it creates (name="altcha") rides along in the fetch. Hidden via CSS. -->
                    <!-- The endpoint goes in `challenge` (it accepts a URL). The older `challengeurl` name is silently ignored by this widget: it then fetches an empty URL, gets this HTML page back instead of JSON, and never produces a token — so the form appears to do nothing at all. -->
                    <altcha-widget class="altcha-hidden" challenge="/api/challenge" auto="onsubmit" name="altcha" hidefooter></altcha-widget>

                    <button type="submit">send</button>
                </form>
                <!-- Name, email, and message fields; validated client-side in support.js (initContactForm). novalidate hands validation to our own code for the presentation. -->

            </div>

            <!-- ----------------------------- Graphic ------------------------------ -->
            <div class="contact-right">
                <img class="contact-image" src="images/sendmail.jpg" alt="A retro terminal screen sending an email that dissolves into a stream of data" width="667" height="1000">
            </div>
            <!-- Decorative sendmail image, centered in the right column to fill the space beside the form. -->

        </div>

    </main>

</body>

</html>
